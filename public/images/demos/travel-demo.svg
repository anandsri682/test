<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#0B2A5B"/>
  <rect width="800" height="450" fill="url(#bg_grad_travel)" opacity="0.4"/>
  
  <path d="M0 50H800M0 100H800M0 150H800M0 200H800M0 250H800M0 300H800M0 350H800M0 400H800" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>

  <!-- UI Window -->
  <rect x="60" y="50" width="680" height="350" rx="12" fill="#FFFFFF"/>
  <rect x="60" y="50" width="680" height="40" rx="12" fill="#F1F5F9"/>
  <circle cx="85" cy="70" r="6" fill="#FF5F56"/>
  <circle cx="105" cy="70" r="6" fill="#FFBD2E"/>
  <circle cx="125" cy="70" r="6" fill="#27C93F"/>
  <rect x="160" y="60" width="300" height="20" rx="6" fill="#E2E8F0"/>
  <text x="170" y="74" font-family="sans-serif" font-size="11" font-weight="600" fill="#64748B">travel.avmsmart.in</text>

  <!-- Content Banner -->
  <rect x="80" y="110" width="640" height="100" rx="12" fill="url(#banner_grad)"/>
  <text x="110" y="145" font-family="sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Discover Global Destinations</text>
  <text x="110" y="170" font-family="sans-serif" font-size="12" font-weight="500" fill="#E0F2FE">Custom Tour Packages, Flight Deals &amp; Instant Itineraries</text>
  <rect x="560" y="140" width="130" height="36" rx="8" fill="#FFFFFF"/>
  <text x="585" y="163" font-family="sans-serif" font-size="12" font-weight="700" fill="#087FF5">Book Package</text>

  <!-- Package Cards -->
  <g transform="translate(80, 230)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="195" height="140" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="10" y="10" width="175" height="65" rx="6" fill="#E0F2FE"/>
    <text x="20" y="95" font-family="sans-serif" font-size="12" font-weight="700" fill="#0B2A5B">Kerala Backwaters</text>
    <text x="20" y="112" font-family="sans-serif" font-size="10" font-weight="500" fill="#64748B">5 Days / 4 Nights</text>
    <text x="135" y="112" font-family="sans-serif" font-size="12" font-weight="800" fill="#FF6A00">₹24,999</text>

    <!-- Card 2 -->
    <rect x="220" y="0" width="195" height="140" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="230" y="10" width="175" height="65" rx="6" fill="#FEF3C7"/>
    <text x="240" y="95" font-family="sans-serif" font-size="12" font-weight="700" fill="#0B2A5B">Himachal Adventure</text>
    <text x="240" y="112" font-family="sans-serif" font-size="10" font-weight="500" fill="#64748B">6 Days / 5 Nights</text>
    <text x="355" y="112" font-family="sans-serif" font-size="12" font-weight="800" fill="#FF6A00">₹18,500</text>

    <!-- Card 3 -->
    <rect x="440" y="0" width="200" height="140" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="450" y="10" width="180" height="65" rx="6" fill="#DCFCE7"/>
    <text x="460" y="95" font-family="sans-serif" font-size="12" font-weight="700" fill="#0B2A5B">Goa Beach Retreat</text>
    <text x="460" y="112" font-family="sans-serif" font-size="10" font-weight="500" fill="#64748B">4 Days / 3 Nights</text>
    <text x="575" y="112" font-family="sans-serif" font-size="12" font-weight="800" fill="#FF6A00">₹15,999</text>
  </g>

  <defs>
    <linearGradient id="bg_grad_travel" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#13B89A"/>
      <stop offset="1" stop-color="#087FF5"/>
    </linearGradient>
    <linearGradient id="banner_grad" x1="0" y1="0" x2="640" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B2A5B"/>
      <stop offset="1" stop-color="#087FF5"/>
    </linearGradient>
  </defs>
</svg>
