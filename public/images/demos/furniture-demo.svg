<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#0B2A5B"/>
  <rect width="800" height="450" fill="url(#bg_grad_furniture)" opacity="0.4"/>
  
  <path d="M0 50H800M0 100H800M0 150H800M0 200H800M0 250H800M0 300H800M0 350H800M0 400H800" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>

  <!-- UI Window Container -->
  <rect x="60" y="50" width="680" height="350" rx="12" fill="#FFFFFF"/>
  <rect x="60" y="50" width="680" height="40" rx="12" fill="#F1F5F9"/>
  <circle cx="85" cy="70" r="6" fill="#FF5F56"/>
  <circle cx="105" cy="70" r="6" fill="#FFBD2E"/>
  <circle cx="125" cy="70" r="6" fill="#27C93F"/>
  <rect x="160" y="60" width="300" height="20" rx="6" fill="#E2E8F0"/>
  <text x="170" y="74" font-family="sans-serif" font-size="11" font-weight="600" fill="#64748B">furniture.avmsmart.in</text>

  <!-- Hero Banner -->
  <rect x="80" y="105" width="640" height="110" rx="12" fill="url(#furniture_hero)"/>
  <text x="110" y="145" font-family="sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Modern Living &amp; Interior Furniture</text>
  <text x="110" y="170" font-family="sans-serif" font-size="12" font-weight="500" fill="#DCFCE7">Premium Sofas, Tables &amp; Ergonomic Office Chairs</text>
  <rect x="560" y="138" width="130" height="36" rx="8" fill="#FFFFFF"/>
  <text x="580" y="161" font-family="sans-serif" font-size="12" font-weight="700" fill="#15803D">Shop Collection</text>

  <!-- Furniture Product Cards -->
  <g transform="translate(80, 235)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="195" height="135" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="10" y="10" width="175" height="60" rx="6" fill="#F0FDF4"/>
    <text x="20" y="92" font-family="sans-serif" font-size="12" font-weight="700" fill="#0B2A5B">Nordic Velvet Sofa</text>
    <text x="20" y="108" font-family="sans-serif" font-size="10" font-weight="500" fill="#64748B">Living Room</text>
    <text x="130" y="108" font-family="sans-serif" font-size="12" font-weight="800" fill="#15803D">₹28,500</text>

    <!-- Card 2 -->
    <rect x="220" y="0" width="195" height="135" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="230" y="10" width="175" height="60" rx="6" fill="#FFF7ED"/>
    <text x="240" y="92" font-family="sans-serif" font-size="12" font-weight="700" fill="#0B2A5B">Oak Dining Table</text>
    <text x="240" y="108" font-family="sans-serif" font-size="10" font-weight="500" fill="#64748B">Dining</text>
    <text x="350" y="108" font-family="sans-serif" font-size="12" font-weight="800" fill="#C2410C">₹34,000</text>

    <!-- Card 3 -->
    <rect x="440" y="0" width="200" height="135" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="450" y="10" width="180" height="60" rx="6" fill="#EFF6FF"/>
    <text x="460" y="92" font-family="sans-serif" font-size="12" font-weight="700" fill="#0B2A5B">Ergo Pro Desk Chair</text>
    <text x="460" y="108" font-family="sans-serif" font-size="10" font-weight="500" fill="#64748B">Office</text>
    <text x="570" y="108" font-family="sans-serif" font-size="12" font-weight="800" fill="#1D4ED8">₹12,999</text>
  </g>

  <defs>
    <linearGradient id="bg_grad_furniture" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67D63B"/>
      <stop offset="1" stop-color="#087FF5"/>
    </linearGradient>
    <linearGradient id="furniture_hero" x1="0" y1="0" x2="640" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15803D"/>
      <stop offset="1" stop-color="#0B2A5B"/>
    </linearGradient>
  </defs>
</svg>
