<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBF4FF"/>
      <stop offset="50%" stop-color="#DBEAFE"/>
      <stop offset="85%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Sun / Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#93C5FD" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner Glow Gradient -->
    <radialGradient id="centerLight" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#E0F2FE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0"/>
    </radialGradient>

    <!-- Arch Glass Gradient -->
    <linearGradient id="archGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#EFF6FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#DBEAFE" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Portal Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    
    <!-- Water Glow Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BFDBFE" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#93C5FD" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EFF6FF" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1E3A8A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1000" height="700" fill="url(#skyGrad)"/>

  <!-- Sun Horizon Glow -->
  <circle cx="500" cy="380" r="280" fill="url(#sunGlow)"/>
  <circle cx="500" cy="360" r="140" fill="url(#centerLight)"/>

  <!-- Distant City Silhouette Lines -->
  <g opacity="0.35">
    <rect x="220" y="310" width="35" height="150" rx="3" fill="#60A5FA"/>
    <rect x="260" y="280" width="45" height="180" rx="3" fill="#3B82F6"/>
    <rect x="310" y="330" width="30" height="130" rx="3" fill="#93C5FD"/>
    <rect x="345" y="260" width="50" height="200" rx="3" fill="#3B82F6"/>
    <rect x="400" y="300" width="40" height="160" rx="3" fill="#60A5FA"/>

    <rect x="560" y="290" width="45" height="170" rx="3" fill="#3B82F6"/>
    <rect x="610" y="320" width="35" height="140" rx="3" fill="#60A5FA"/>
    <rect x="650" y="270" width="55" height="190" rx="3" fill="#3B82F6"/>
    <rect x="710" y="305" width="40" height="155" rx="3" fill="#93C5FD"/>
    <rect x="755" y="335" width="30" height="125" rx="3" fill="#60A5FA"/>
  </g>

  <!-- Modern Grid / Bridge Perspective Lines -->
  <g stroke="#93C5FD" stroke-opacity="0.3" stroke-width="1.5">
    <line x1="500" y1="460" x2="100" y2="700"/>
    <line x1="500" y1="460" x2="250" y2="700"/>
    <line x1="500" y1="460" x2="400" y2="700"/>
    <line x1="500" y1="460" x2="500" y2="700"/>
    <line x1="500" y1="460" x2="600" y2="700"/>
    <line x1="500" y1="460" x2="750" y2="700"/>
    <line x1="500" y1="460" x2="900" y2="700"/>

    <line x1="200" y1="520" x2="800" y2="520"/>
    <line x1="160" y1="570" x2="840" y2="570"/>
    <line x1="110" y1="630" x2="890" y2="630"/>
  </g>

  <!-- Water Surface & Reflections -->
  <rect x="0" y="460" width="1000" height="240" fill="url(#waterGrad)"/>
  <ellipse cx="500" cy="500" rx="320" ry="12" fill="#FFFFFF" opacity="0.6"/>
  <ellipse cx="500" cy="540" rx="260" ry="8" fill="#FFFFFF" opacity="0.4"/>
  <ellipse cx="500" cy="590" rx="180" ry="6" fill="#FFFFFF" opacity="0.3"/>

  <!-- Architectural Portal Outer Ring structure -->
  <g filter="url(#softShadow)">
    <!-- Main Outer Portal Arch -->
    <path d="M 180 500 A 320 320 0 0 1 820 500 Z" fill="none" stroke="url(#rimGrad)" stroke-width="14" opacity="0.95"/>
    <path d="M 210 500 A 290 290 0 0 1 790 500 Z" fill="url(#archGlass)" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M 240 500 A 260 260 0 0 1 760 500 Z" fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="8,6" opacity="0.7"/>

    <!-- Concentric Inner Glowing Arch -->
    <path d="M 280 500 A 220 220 0 0 1 720 500 Z" fill="none" stroke="#2563EB" stroke-width="4" opacity="0.8"/>
  </g>

  <!-- Floating Tech / Architectural Light Nodes -->
  <circle cx="320" cy="280" r="6" fill="#3B82F6" filter="url(#glowShadow)"/>
  <circle cx="680" cy="280" r="6" fill="#3B82F6" filter="url(#glowShadow)"/>
  <circle cx="500" cy="180" r="8" fill="#2563EB" filter="url(#glowShadow)"/>
  <circle cx="210" cy="400" r="5" fill="#60A5FA"/>
  <circle cx="790" cy="400" r="5" fill="#60A5FA"/>

  <!-- Subtly Curved Light Beams -->
  <path d="M 500 180 Q 320 280 210 400" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 500 180 Q 680 280 790 400" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="4,4"/>
</svg>
