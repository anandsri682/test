<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCardOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="50%" stop-color="#FFEDD5"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>
    <linearGradient id="logoOrangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C33"/>
      <stop offset="50%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#D95200"/>
    </linearGradient>
    <filter id="glowOrange">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="400" rx="20" fill="url(#bgGradCardOrange)"/>
  <circle cx="480" cy="100" r="140" fill="#FF6A00" opacity="0.12" filter="url(#glowOrange)"/>
  <circle cx="120" cy="300" r="120" fill="#FF8C33" opacity="0.15" filter="url(#glowOrange)"/>

  <!-- Inner Canvas Frame -->
  <rect x="70" y="40" width="460" height="320" rx="16" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2"/>

  <!-- Grid lines -->
  <g stroke="#FED7AA" stroke-width="1" stroke-dasharray="6 6">
    <line x1="70" y1="120" x2="530" y2="120"/>
    <line x1="70" y1="200" x2="530" y2="200"/>
    <line x1="70" y1="280" x2="530" y2="280"/>
    <line x1="185" y1="40" x2="185" y2="360"/>
    <line x1="300" y1="40" x2="300" y2="360"/>
    <line x1="415" y1="40" x2="415" y2="360"/>
  </g>

  <!-- Central Geometric Emblem -->
  <circle cx="300" cy="190" r="75" fill="none" stroke="url(#logoOrangeGlow)" stroke-width="8" filter="url(#glowOrange)"/>
  <path d="M 250 190 L 300 110 L 350 190 L 300 270 Z" fill="none" stroke="#FF8C33" stroke-width="6"/>
  <circle cx="300" cy="190" r="30" fill="url(#logoOrangeGlow)"/>

  <!-- Vector Anchor Points -->
  <rect x="245" y="185" width="10" height="10" fill="#FFFFFF" stroke="#FF6A00" stroke-width="2.5"/>
  <rect x="345" y="185" width="10" height="10" fill="#FFFFFF" stroke="#FF6A00" stroke-width="2.5"/>
  <rect x="295" y="105" width="10" height="10" fill="#FFFFFF" stroke="#FF6A00" stroke-width="2.5"/>
  <rect x="295" y="265" width="10" height="10" fill="#FFFFFF" stroke="#FF6A00" stroke-width="2.5"/>

  <!-- Bezier Control Handles -->
  <line x1="250" y1="190" x2="205" y2="155" stroke="#FF6A00" stroke-width="2"/>
  <circle cx="205" cy="155" r="4" fill="#FF6A00"/>
  <line x1="350" y1="190" x2="395" y2="225" stroke="#FF6A00" stroke-width="2"/>
  <circle cx="395" cy="225" r="4" fill="#FF6A00"/>

  <!-- Vector Pen Tool Icon -->
  <g transform="translate(390, 100) rotate(-45)">
    <path d="M 0 0 L 20 -32 L 40 0 L 28 55 L 12 55 Z" fill="#FF6A00" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="20" cy="12" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Color Swatches -->
  <circle cx="110" cy="325" r="12" fill="#FF6A00"/>
  <circle cx="142" cy="325" r="12" fill="#FF8C33"/>
  <circle cx="174" cy="325" r="12" fill="#F97316"/>
  <circle cx="206" cy="325" r="12" fill="#C2410C"/>
  <circle cx="238" cy="325" r="12" fill="#7C2D12"/>

  <!-- Brand Typography Preview -->
  <text x="310" y="332" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#7C2D12" letter-spacing="3">BRAND IDENTITY</text>
</svg>
