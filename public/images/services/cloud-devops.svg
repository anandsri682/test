<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cloudGrad" x1="60" y1="40" x2="220" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="160" y1="100" x2="250" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="softShadowCloud" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#6366F1" flood-opacity="0.3"/>
    </filter>
    <filter id="cloudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="160" cy="110" r="90" fill="#6366F1" opacity="0.12" filter="url(#cloudGlow)"/>

  <!-- Server Stack Base Shadow -->
  <ellipse cx="225" cy="186" rx="55" ry="12" fill="#0F172A" opacity="0.2"/>

  <!-- 3D SERVER STACK (Right Side) -->
  <g transform="translate(175, 95)" filter="url(#softShadowCloud)">
    <!-- Server Unit 3 (Bottom) -->
    <rect x="0" y="56" width="95" height="26" rx="6" fill="url(#serverGrad)" stroke="#475569" stroke-width="1.5"/>
    <circle cx="14" cy="69" r="3" fill="#10B981"/>
    <circle cx="24" cy="69" r="3" fill="#38BDF8"/>
    <rect x="36" y="66" width="48" height="6" rx="3" fill="#334155"/>

    <!-- Server Unit 2 (Middle) -->
    <rect x="0" y="28" width="95" height="26" rx="6" fill="url(#serverGrad)" stroke="#475569" stroke-width="1.5"/>
    <circle cx="14" cy="41" r="3" fill="#10B981"/>
    <circle cx="24" cy="41" r="3" fill="#6366F1"/>
    <rect x="36" y="38" width="48" height="6" rx="3" fill="#334155"/>

    <!-- Server Unit 1 (Top) -->
    <rect x="0" y="0" width="95" height="26" rx="6" fill="url(#serverGrad)" stroke="#475569" stroke-width="1.5"/>
    <circle cx="14" cy="13" r="3" fill="#10B981"/>
    <circle cx="24" cy="13" r="3" fill="#EC4899"/>
    <rect x="36" y="10" width="48" height="6" rx="3" fill="#334155"/>
  </g>

  <!-- 3D CLOUD (Main Left Element) -->
  <g transform="translate(45, 45)" filter="url(#softShadowCloud)">
    <!-- Cloud Path -->
    <path d="M50 100 C25 100 10 80 10 60 C10 40 30 25 50 25 C60 10 85 0 110 10 C130 -5 160 5 170 25 C190 25 205 40 205 60 C205 80 190 100 165 100 Z" fill="url(#cloudGrad)"/>
    
    <!-- Inner Highlight Arc -->
    <path d="M55 35 C65 20 85 12 108 20" stroke="#A5B4FC" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- AWS Badge -->
  <g transform="translate(60, 115)" filter="url(#softShadowCloud)">
    <rect x="0" y="0" width="46" height="30" rx="8" fill="#FF9900"/>
    <text x="7" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#000000">aws</text>
    <path d="M10 24 Q 23 28 36 24" stroke="#000000" stroke-width="2" fill="none"/>
    <polygon points="36,24 32,22 33,26" fill="#000000"/>
  </g>

  <!-- Drive / Storage Badge -->
  <g transform="translate(262, 105)" filter="url(#softShadowCloud)">
    <rect x="0" y="0" width="34" height="34" rx="10" fill="#FFFFFF"/>
    <polygon points="17,8 26,24 21,24 12,8" fill="#FFC107"/>
    <polygon points="12,8 21,24 8,24 4,16" fill="#0066DA"/>
    <polygon points="17,16 26,24 8,24" fill="#00AC47"/>
  </g>

  <!-- Floating Network Lines & Nodes -->
  <path d="M165 85 Q 185 70 200 95" stroke="#A5B4FC" stroke-width="2" stroke-dasharray="3 3" fill="none"/>
  <circle cx="165" cy="85" r="4" fill="#818CF8"/>
  <circle cx="200" cy="95" r="4" fill="#818CF8"/>
</svg>
