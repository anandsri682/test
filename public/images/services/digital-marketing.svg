<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="mktGrad" x1="40" y1="40" x2="280" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="chartBar1" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="chartBar2" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="chartBar3" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="softShadowMkt" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#FF6A00" flood-opacity="0.3"/>
    </filter>
    <filter id="mktGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="160" cy="110" r="90" fill="#FF6A00" opacity="0.12" filter="url(#mktGlow)"/>

  <!-- 3D Bar Chart (Right Side) -->
  <!-- Base Shadow -->
  <ellipse cx="230" cy="180" rx="65" ry="14" fill="#0F172A" opacity="0.15"/>

  <!-- Bar 1 (Light Blue) -->
  <rect x="180" y="130" width="22" height="45" rx="6" fill="url(#chartBar1)" filter="url(#softShadowMkt)"/>
  <!-- Bar 2 (Orange) -->
  <rect x="210" y="105" width="22" height="70" rx="6" fill="url(#chartBar2)" filter="url(#softShadowMkt)"/>
  <!-- Bar 3 (Deep Blue) -->
  <rect x="240" y="70" width="22" height="105" rx="6" fill="url(#chartBar3)" filter="url(#softShadowMkt)"/>

  <!-- Growth Arrow Curve (Rising Arrow) -->
  <path d="M165 145 C 190 135, 210 90, 275 45" stroke="#FF6A00" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#softShadowMkt)"/>
  <polygon points="280,38 275,55 262,45" fill="#FF6A00"/>

  <!-- 3D Megaphone (Left Side) -->
  <g transform="translate(45, 80) rotate(-15)" filter="url(#softShadowMkt)">
    <!-- Cone Body -->
    <path d="M35 25 L85 5 L85 65 L35 45 Z" fill="url(#mktGrad)"/>
    <!-- Cone Opening Ring -->
    <ellipse cx="85" cy="35" rx="10" ry="30" fill="#F97316" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Back Cap -->
    <path d="M15 25 C15 20, 25 20, 35 25 L35 45 C25 50, 15 50, 15 45 Z" fill="#334155"/>
    <!-- Handle -->
    <path d="M45 42 L38 75 C36 80, 42 84, 47 80 L55 45 Z" fill="#1E293B"/>
    <!-- Sound Wave Arcs -->
    <path d="M102 20 C 112 28, 112 42, 102 50" stroke="#FF6A00" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M114 12 C 130 25, 130 45, 114 58" stroke="#F97316" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 3" fill="none"/>
  </g>

  <!-- Floating Social Media Badges (Top Area) -->
  <!-- Google Badge -->
  <g transform="translate(195, 30)" filter="url(#softShadowMkt)">
    <rect x="0" y="0" width="34" height="34" rx="10" fill="#FFFFFF"/>
    <path d="M17 11 C20.3 11 22.5 12.4 23.8 13.6 L21.1 16.2 C20.3 15.4 19 14.4 17 14.4 C14.3 14.4 12.1 16.7 12.1 19.5 C12.1 22.3 14.3 24.6 17 24.6 C20.1 24.6 21.4 22.4 21.6 20.9 L17 20.9 L17 17.5 L25.2 17.5 C25.3 18.2 25.4 19 25.4 19.9 C25.4 24.9 22 28 17 28 C12.3 28 8.5 24.2 8.5 19.5 C8.5 14.8 12.3 11 17 11 Z" fill="#4285F4"/>
  </g>

  <!-- Meta Badge -->
  <g transform="translate(242, 35)" filter="url(#softShadowMkt)">
    <rect x="0" y="0" width="34" height="34" rx="10" fill="#FFFFFF"/>
    <path d="M12 14 C9.8 14 8 15.8 8 18 C8 20.2 9.8 22 12 22 C13.8 22 15 20.5 17 18 C19 15.5 20.2 14 22 14 C24.2 14 26 15.8 26 18 C26 20.2 24.2 22 22 22 C20.2 22 19 20.5 17 18 C15 15.5 13.8 14 12 14 Z" stroke="#0081FB" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Instagram Badge -->
  <g transform="translate(280, 48)" filter="url(#softShadowMkt)">
    <rect x="0" y="0" width="32" height="32" rx="9" fill="url(#chartBar2)"/>
    <rect x="8" y="8" width="16" height="16" rx="5" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <circle cx="16" cy="16" r="4" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <circle cx="20" cy="12" r="1" fill="#FFFFFF"/>
  </g>
</svg>
