<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="consultGrad" x1="40" y1="30" x2="280" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="softShadowConsult" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.3"/>
    </filter>
    <filter id="consultGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="160" cy="110" r="90" fill="#F59E0B" opacity="0.12" filter="url(#consultGlow)"/>

  <!-- Shadow Base -->
  <ellipse cx="140" cy="184" rx="85" ry="14" fill="#0F172A" opacity="0.15"/>
  <ellipse cx="255" cy="188" rx="25" ry="8" fill="#0F172A" opacity="0.18"/>

  <!-- DASHBOARD BOARD (Left / Center) -->
  <g transform="translate(65, 35)" filter="url(#softShadowConsult)">
    <!-- Board Base Frame -->
    <rect x="0" y="0" width="165" height="135" rx="14" fill="#FFFFFF" stroke="#FBBF24" stroke-width="2"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="165" height="24" rx="14" fill="#FEF3C7"/>
    <rect x="12" y="9" width="40" height="6" rx="3" fill="#D97706"/>

    <!-- Lightbulb Strategy Icon (Top Right of Board) -->
    <circle cx="140" cy="20" r="14" fill="#F59E0B"/>
    <path d="M140 11 C135 11 133 14 133 18 C133 21 135 23 137 25 L143 25 C145 23 147 21 147 18 C147 14 145 11 140 11 Z" fill="#FFFFFF"/>
    <rect x="138" y="26" width="4" height="4" fill="#FFFFFF"/>

    <!-- Growth Analytics Line Chart inside Board -->
    <rect x="12" y="38" width="141" height="85" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Grid Lines -->
    <line x1="20" y1="58" x2="145" y2="58" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="20" y1="80" x2="145" y2="80" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="20" y1="102" x2="145" y2="102" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Blue/Amber Line Graph -->
    <path d="M25 95 L55 75 L85 85 L115 50 L140 60" stroke="#3B82F6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="25" cy="95" r="3.5" fill="#3B82F6"/>
    <circle cx="55" cy="75" r="3.5" fill="#3B82F6"/>
    <circle cx="85" cy="85" r="3.5" fill="#3B82F6"/>
    <circle cx="115" cy="50" r="4.5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="140" cy="60" r="3.5" fill="#3B82F6"/>

    <!-- Bar Chart Elements (Bottom Left inside Board) -->
    <rect x="25" y="105" width="12" height="12" rx="2" fill="#FBBF24"/>
    <rect x="42" y="98" width="12" height="19" rx="2" fill="#F59E0B"/>
    <rect x="59" y="90" width="12" height="27" rx="2" fill="#D97706"/>
  </g>

  <!-- 3D CONSULTANT FIGURE (Right Side) -->
  <g transform="translate(235, 75)" filter="url(#softShadowConsult)">
    <!-- Head -->
    <circle cx="20" cy="14" r="10" fill="#FFE0B2"/>
    <!-- Hair -->
    <path d="M10 12 C10 4 30 4 30 12 C30 8 10 8 10 12 Z" fill="#1E293B"/>

    <!-- Suit Torso -->
    <path d="M6 28 L34 28 L38 75 L2 75 Z" fill="#1E293B"/>
    <!-- Shirt / Tie -->
    <polygon points="20,28 14,42 26,42" fill="#FFFFFF"/>
    <polygon points="20,32 18,52 22,52" fill="#2563EB"/>

    <!-- Pointer Arm (Pointing to Chart) -->
    <path d="M10 32 L-20 20" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
    <!-- Pointer Stick -->
    <line x1="-20" y1="20" x2="-45" y2="10" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>

    <!-- Legs -->
    <rect x="8" y="75" width="10" height="40" rx="3" fill="#0F172A"/>
    <rect x="22" y="75" width="10" height="40" rx="3" fill="#0F172A"/>
  </g>

  <!-- Floating Strategy Gear (Bottom Right) -->
  <g transform="translate(45, 125)" filter="url(#softShadowConsult)">
    <circle cx="18" cy="18" r="14" fill="#2563EB"/>
    <circle cx="18" cy="18" r="6" fill="#FFFFFF"/>
    <!-- Gear Teeth -->
    <rect x="16" y="0" width="4" height="36" fill="#2563EB" rx="1"/>
    <rect x="0" y="16" width="36" height="4" fill="#2563EB" rx="1"/>
    <rect x="16" y="0" width="4" height="36" fill="#2563EB" rx="1" transform="rotate(45 18 18)"/>
    <rect x="16" y="0" width="4" height="36" fill="#2563EB" rx="1" transform="rotate(-45 18 18)"/>
  </g>
</svg>
