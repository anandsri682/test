<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="laptopGrad" x1="40" y1="50" x2="260" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="70" y1="40" x2="230" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="codeBadgeGrad" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="globeGrad" x1="0" y1="0" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#087FF5" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="160" cy="110" r="90" fill="#087FF5" opacity="0.12" filter="url(#glow)"/>

  <!-- Isometric Laptop Base Base Glow -->
  <ellipse cx="160" cy="175" rx="110" ry="18" fill="#0F172A" opacity="0.15"/>

  <!-- Laptop Base Plate -->
  <path d="M40 162 C40 156, 50 152, 60 152 L260 152 C270 152, 280 156, 280 162 L268 178 C266 182, 255 184, 245 184 L75 184 C65 184, 54 182, 52 178 Z" fill="url(#laptopGrad)" filter="url(#softShadow)"/>
  <!-- Trackpad -->
  <path d="M135 168 L185 168 C188 168, 190 170, 189 173 L187 178 C186 180, 184 181, 181 181 L139 181 C136 181, 134 180, 133 178 L131 173 C130 170, 132 168, 135 168 Z" fill="#64748B" opacity="0.5"/>

  <!-- Laptop Screen Lid Frame -->
  <rect x="70" y="32" width="180" height="120" rx="12" fill="#1E293B" stroke="#334155" stroke-width="3" filter="url(#softShadow)"/>
  <!-- Screen Inner Display -->
  <rect x="76" y="38" width="168" height="108" rx="8" fill="url(#screenGrad)"/>

  <!-- Window Header Bar -->
  <path d="M76 46 C76 41.5, 79.5 38, 84 38 L236 38 C240.5 38, 244 41.5, 244 46 L244 54 L76 54 Z" fill="#334155" opacity="0.8"/>
  <circle cx="88" cy="46" r="3.5" fill="#EF4444"/>
  <circle cx="98" cy="46" r="3.5" fill="#F59E0B"/>
  <circle cx="108" cy="46" r="3.5" fill="#10B981"/>

  <!-- Code Lines on Display -->
  <!-- Sidebar -->
  <rect x="84" y="60" width="32" height="78" rx="4" fill="#1E293B" opacity="0.6"/>
  <rect x="88" y="66" width="24" height="4" rx="2" fill="#38BDF8"/>
  <rect x="88" y="74" width="18" height="3" rx="1.5" fill="#64748B"/>
  <rect x="88" y="81" width="20" height="3" rx="1.5" fill="#64748B"/>
  <rect x="88" y="88" width="15" height="3" rx="1.5" fill="#64748B"/>

  <!-- Main Code Editor Area -->
  <rect x="122" y="66" width="35" height="6" rx="3" fill="#EC4899"/>
  <rect x="161" y="66" width="45" height="6" rx="3" fill="#38BDF8"/>
  
  <rect x="132" y="78" width="55" height="6" rx="3" fill="#F59E0B"/>
  <rect x="191" y="78" width="30" height="6" rx="3" fill="#10B981"/>

  <rect x="142" y="90" width="40" height="6" rx="3" fill="#60A5FA"/>
  <rect x="186" y="90" width="48" height="6" rx="3" fill="#A855F7"/>

  <rect x="132" y="102" width="65" height="6" rx="3" fill="#34D399"/>

  <rect x="122" y="114" width="40" height="6" rx="3" fill="#EC4899"/>

  <!-- Floating 3D Code Badge </> (Left Above Laptop) -->
  <g transform="translate(45, 45)" filter="url(#softShadow)">
    <rect x="0" y="0" width="54" height="54" rx="16" fill="url(#codeBadgeGrad)"/>
    <path d="M18 27 L12 21 L18 15" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 15 L42 21 L36 27" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 13 L24 29" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floating 3D Globe Badge 🌐 (Right Center) -->
  <g transform="translate(225, 95)" filter="url(#softShadow)">
    <circle cx="26" cy="26" r="24" fill="url(#globeGrad)"/>
    <circle cx="26" cy="26" r="20" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 2" fill="none" opacity="0.8"/>
    <ellipse cx="26" cy="26" rx="20" ry="9" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <line x1="26" y1="6" x2="26" y2="46" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="6" y1="26" x2="46" y2="26" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Floating Sparkles & Particles -->
  <circle cx="260" cy="45" r="4" fill="#38BDF8" opacity="0.8"/>
  <circle cx="50" cy="130" r="3" fill="#60A5FA" opacity="0.7"/>
  <polygon points="120,25 123,31 129,32 124,37 126,43 120,40 114,43 116,37 111,32 117,31" fill="#F59E0B" opacity="0.9"/>
</svg>
